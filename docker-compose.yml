services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data:ro
      # Keeps the ~1.5 GB EmbeddingGemma 2 download across container rebuilds
      - hf_cache:/home/appuser/.cache/huggingface
    env_file: .env
    environment:
      DB_HOST: psql_bp
      DB_PORT: 5432
    depends_on:
      - psql_bp
    # Live reload while developing: run `docker compose up --watch` (ignored by a plain `up`)
    develop:
      watch:
        # Frontend files are read from disk on every request, so copying them in is enough
        - path: ./public
          target: /app/public
          action: sync
          ignore:
            # Symlink to ../data, which is already mounted; syncing it would copy every media file in
            - data
        # Python changes need the app restarted; the next search reloads the model (~5 s)
        - path: ./src
          target: /app/src
          action: sync+restart
          ignore:
            - requirements.txt
            - __pycache__/
        - path: ./src/requirements.txt
          action: rebuild

  psql_bp:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - psql_volume_bp:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

  pgadmin:
    image: dpage/pgadmin4
    profiles: ["pgadmin"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - psql_bp

volumes:
  psql_volume_bp:
  pgadmin_data:
  hf_cache:
