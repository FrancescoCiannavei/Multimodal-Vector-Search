services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data:ro
    env_file: .env
    environment:
      # Inside the compose network Postgres is reached by service name on its container port,
      # so these override the host-side values from .env
      DB_HOST: psql_bp
      DB_PORT: 5432
    depends_on:
      - psql_bp

  psql_bp:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - psql_volume_bp:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  psql_volume_bp:
