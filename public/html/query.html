<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Search</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" />
		<link rel="stylesheet" href="/css/style.css" />
	</head>
	<body>
		<main class="wrapper">
			<nav class="nav">
				<a href="/" aria-current="page">Search</a>
				<a href="/seed">Seed</a>
			</nav>

			<h1>Search</h1>

			<div
				class="warning"
				role="note"
				style="display: flex; align-items: flex-start; gap: 12px; margin-bottom: 24px; padding: 12px 16px; border-left: 4px solid #ef6c00; border-radius: 0 var(--radius) var(--radius) 0; background: #fcd9b0; color: #7a3a00; font-weight: 500"
			>
				<!--!Font Awesome Free 7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
				<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" aria-hidden="true" style="flex-shrink: 0; width: 22px; height: 22px; margin-top: 1px; fill: currentColor">
					<path
						d="M320 64C334.7 64 348.2 72.1 355.2 85L571.2 485C577.9 497.4 577.6 512.4 570.4 524.5C563.2 536.6 550.1 544 536 544L104 544C89.9 544 76.8 536.6 69.6 524.5C62.4 512.4 62.1 497.4 68.8 485L284.8 85C291.8 72.1 305.3 64 320 64zM320 416C302.3 416 288 430.3 288 448C288 465.7 302.3 480 320 480C337.7 480 352 465.7 352 448C352 430.3 337.7 416 320 416zM320 224C301.8 224 287.3 239.5 288.6 257.7L296 361.7C296.9 374.2 307.4 384 319.9 384C332.5 384 342.9 374.3 343.8 361.7L351.2 257.7C352.5 239.5 338.1 224 319.8 224z"
					></path>
				</svg>
				<p>This demo uses Google's Gemini API on the <i><b>free tier</b></i> instead of the local model, so results are less accurate: distances are higher and some relevant results might not show up.</p>
			</div>

			<form method="get" id="searchForm">
				<input type="search" class="input" name="searchInput" id="searchInput" placeholder="Try &quot;Coffee&quot;, &quot;Gundam&quot; or &quot;Volcano&quot;" autocomplete="off" required />
				<button type="submit" class="button" id="searchButton">Search</button>
			</form>
			<p id="status" aria-live="polite"></p>
			<div id="results"></div>
		</main>

		<footer class="footer">
			<span class="credit">Demo by Francesco Ciannavei</span>
			<span class="separator credit-separator">·</span>
			<a target="_blank" href="https://www.ciannavei.dev">ciannavei.dev</a>
			<span class="separator">·</span>
			<a target="_blank" href="https://github.com/FrancescoCiannavei">github.com/FrancescoCiannavei</a>
		</footer>

		<script src="/js/script.js"></script>
	</body>
</html>
