<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Search</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" />
		<link rel="stylesheet" href="/css/style.css" />
	</head>
	<body>
		<main class="wrapper">
			<h1>Search</h1>
			<form method="get" id="searchForm">
				<input type="search" name="searchInput" id="searchInput" placeholder="Try &quot;Coffee&quot;, &quot;Gundam&quot; or &quot;Volcano&quot;" autocomplete="off" required />
				<button type="submit" id="searchButton">Search</button>
			</form>
			<p id="status" aria-live="polite"></p>
			<div id="results"></div>
		</main>

		<footer class="footer">
			<span class="credit">Demo by Francesco Ciannavei</span>
			<span class="separator credit-separator">·</span>
			<a target="_blank" href="https://www.ciannavei.dev">ciannavei.dev</a>
			<span class="separator">·</span>
			<a target="_blank" href="https://github.com/FrancescoCiannavei">github.com/FrancescoCiannavei</a>
		</footer>

		<script src="/js/script.js"></script>
	</body>
</html>
